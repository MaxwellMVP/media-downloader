<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Media Downloader</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="app">
    <header class="titlebar pywebview-drag-region" id="titlebar">
      <div class="brand">
        <img src="assets/app.png" alt="" width="18" height="18">
        <span>Media Downloader</span>
      </div>
      <div class="titlebar-actions">
        <div class="gear-wrap">
          <button class="icon-btn" id="gear" type="button" title="Settings" data-i18n-title="settings" aria-haspopup="true" aria-expanded="false">
            <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true">
              <path d="M2 4h12M2 8h12M2 12h12" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
              <circle cx="5.5" cy="4" r="1.8" fill="none" stroke="currentColor" stroke-width="1.4"/>
              <circle cx="10.5" cy="8" r="1.8" fill="none" stroke="currentColor" stroke-width="1.4"/>
              <circle cx="6" cy="12" r="1.8" fill="none" stroke="currentColor" stroke-width="1.4"/>
            </svg>
          </button>
          <div class="menu" id="menu" role="menu" hidden>
            <button class="menu-item" type="button" data-action="choose" role="menuitem">
              <img src="assets/folder.png" alt="">
              <span data-i18n="choose_folder">Downloads folder…</span>
            </button>
            <button class="menu-item" type="button" data-action="open" role="menuitem">
              <img src="assets/folder.png" alt="">
              <span data-i18n="open_folder">Open folder</span>
            </button>
            <button class="menu-item" type="button" data-action="language" role="menuitem">
              <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true">
                <circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
                <path d="M2 8h12M8 2c2 2.2 2 9.8 0 12M8 2c-2 2.2-2 9.8 0 12" fill="none" stroke="currentColor" stroke-width="1.2"/>
              </svg>
              <span id="lang-label">Language: English</span>
            </button>
            <div class="menu-path" id="menu-path"></div>
          </div>
        </div>
        <div class="window-controls">
          <button class="win-btn" id="win-min" type="button" title="Minimize" aria-label="Minimize" data-i18n-title="minimize" data-i18n-label="minimize">
            <svg viewBox="0 0 10 10" width="10" height="10" aria-hidden="true"><path d="M0 5h10" stroke="currentColor" stroke-width="1"/></svg>
          </button>
          <button class="win-btn" id="win-max" type="button" title="Maximize" aria-label="Maximize">
            <svg viewBox="0 0 10 10" width="10" height="10" aria-hidden="true"><rect x="0.5" y="0.5" width="9" height="9" fill="none" stroke="currentColor" stroke-width="1"/></svg>
          </button>
          <button class="win-btn win-close" id="win-close" type="button" title="Close" aria-label="Close" data-i18n-title="close" data-i18n-label="close">
            <svg viewBox="0 0 10 10" width="10" height="10" aria-hidden="true"><path d="M0 0l10 10M10 0L0 10" stroke="currentColor" stroke-width="1"/></svg>
          </button>
        </div>
      </div>
    </header>

    <main class="content">
      <div class="platforms" role="group" aria-label="Platforms" data-i18n-label="platforms_label">
        <button class="badge" type="button" data-platform="youtube" title="YouTube">
          <img src="assets/yt.png" alt="YouTube">
        </button>
        <button class="badge" type="button" data-platform="spotify" title="Spotify">
          <img src="assets/sp.png" alt="Spotify">
        </button>
        <button class="badge" type="button" data-platform="tiktok" title="TikTok">
          <img src="assets/tt.png" alt="TikTok">
        </button>
      </div>

      <label class="urlrow">
        <svg class="search-icon" viewBox="0 0 16 16" width="15" height="15" aria-hidden="true">
          <circle cx="7" cy="7" r="5" fill="none" stroke="currentColor" stroke-width="1.6"/>
          <path d="M11 11l3.5 3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
        <input id="url" type="text" placeholder="https://..." autocomplete="off" spellcheck="false">
      </label>
      <p class="hint" data-i18n="hint">Paste a link from TikTok, YouTube or Spotify</p>

      <div class="formats" role="group" aria-label="Format" data-i18n-label="format_label">
        <button class="format active" type="button" data-format="video" aria-pressed="true">
          <img src="assets/video.png" alt="">
          <span class="format-text"><b data-i18n="format_video">Video MP4</b><small data-i18n="format_video_sub">Best quality</small></span>
        </button>
        <button class="format" type="button" data-format="music" aria-pressed="false">
          <img src="assets/music.png" alt="">
          <span class="format-text"><b data-i18n="format_music">Music</b><small>MP3</small></span>
        </button>
      </div>

      <button class="download" id="download" type="button">
        <img src="assets/download.png" alt="">
        <span id="download-label">Download</span>
      </button>

      <section class="results">
        <div class="banner" id="banner" role="status" hidden>
          <span class="banner-icon" id="banner-icon" aria-hidden="true"></span>
          <span class="banner-text" id="banner-text"></span>
        </div>
        <div class="progress" id="progress" hidden>
          <div class="bar" id="bar"></div>
        </div>
        <div class="empty" id="empty">
          <p class="empty-title" data-i18n="empty_title">No downloads in this session yet</p>
          <p class="empty-sub" data-i18n="empty_sub">Paste a link and press “Download”</p>
        </div>
        <div class="gallery" id="gallery" hidden></div>
      </section>
    </main>

    <div class="rz rz-e" data-edge="e" aria-hidden="true"></div>
    <div class="rz rz-s" data-edge="s" aria-hidden="true"></div>
    <div class="rz rz-se" data-edge="se" aria-hidden="true"></div>
  </div>
  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
