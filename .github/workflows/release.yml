name: Release on version change

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      needed: ${{ steps.version.outputs.needed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Read version and check for an existing release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^APP_VER = "v\([^"]*\)".*/\1/p' mediadl/config.py)
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then echo "Invalid application version: $version"; exit 1; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then needed=false; else needed=true; fi
          echo "needed=$needed" >> "$GITHUB_OUTPUT"

  release:
    needs: check
    if: needs.check.outputs.needed == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-lock.txt -r requirements-build.txt
      - run: python -m unittest test_app -v
      - name: Download locked helper tools
        run: python scripts/download_tools.py
      - name: Install Inno Setup
        shell: pwsh
        run: ./scripts/install_inno.ps1
      - name: Build portable and installer
        run: python scripts/build.py --iscc build/inno/ISCC.exe
      - name: Package release files
        run: python scripts/package_release.py
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ needs.check.outputs.version }}
        run: |
          $dir = "Release/v$env:APP_VERSION"
          $files = @(
            "$dir/MediaDownloader-v$env:APP_VERSION-Setup.exe",
            "$dir/MediaDownloader-v$env:APP_VERSION-Portable.zip",
            "$dir/MediaDownloader-v$env:APP_VERSION-Source.zip",
            "$dir/SHA256SUMS.txt")
          gh release create "v$env:APP_VERSION" @files --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Media Downloader v$env:APP_VERSION" --generate-notes
