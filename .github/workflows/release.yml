name: Windows release build

on:
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'scripts/**'
      - 'packaging/**'
      - 'requirements*.txt'
      - 'build_bin/**'
  workflow_dispatch:
    inputs:
      sign:
        description: 'Request production SignPath signatures (requires approved account)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 35
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-lock.txt -r requirements-build.txt
      - run: python -m unittest test_app -v
      - name: Read version from source
        id: version
        shell: pwsh
        run: |
          $version = python -c "import sys; sys.path.insert(0, 'scripts'); from build import version; print(version())"
          if ($LASTEXITCODE -ne 0 -or $version -notmatch '^\d+\.\d+(\.\d+)?$') { throw 'Invalid application version' }
          "version=$version" >> $env:GITHUB_OUTPUT
      - run: python scripts/download_tools.py
      - shell: pwsh
        run: ./scripts/install_inno.ps1
      - run: python scripts/build.py --iscc build/inno/ISCC.exe
      - run: python scripts/package_release.py
      - name: Upload portable for signing in this run
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-portable
          path: Portable/MediaDownloader.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Upload unsigned release for inspection
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-release
          path: Release/v${{ steps.version.outputs.version }}/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  sign:
    if: github.event_name == 'workflow_dispatch' && inputs.sign && github.ref == 'refs/heads/main' && github.repository == 'MaxwellMVP/media-downloader'
    needs: build
    runs-on: windows-latest
    timeout-minutes: 120
    environment: signpath-production
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check SignPath configuration
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
        run: |
          foreach ($name in @('SIGNPATH_API_TOKEN', 'SIGNPATH_ORGANIZATION_ID', 'SIGNPATH_PROJECT_SLUG', 'SIGNPATH_SIGNING_POLICY_SLUG')) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) { throw "Missing configuration: $name; see docs/CODE_SIGNING.md" }
          }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: unsigned-portable
          path: Portable
      - name: Upload signing input with current job provenance
        id: portable
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signpath-portable-input
          path: Portable/MediaDownloader.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Sign application (approve in SignPath)
        uses: SignPath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: portable
          github-artifact-id: ${{ steps.portable.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 2700
          output-artifact-directory: signed-portable
          parameters: |
            version: "${{ needs.build.outputs.version }}"
      - name: Verify and use signed application
        shell: pwsh
        run: |
          ./scripts/verify_signature.ps1 -Path signed-portable/MediaDownloader.exe
          Copy-Item signed-portable/MediaDownloader.exe Portable/MediaDownloader.exe -Force
      - shell: pwsh
        run: ./scripts/install_inno.ps1
      - name: Build installer containing the signed application
        run: python scripts/build.py --skip-portable --iscc build/inno/ISCC.exe
      - id: installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signpath-installer-input
          path: Release/v${{ needs.build.outputs.version }}/*-Setup.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Sign installer (approve in SignPath)
        uses: SignPath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.installer.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 2700
          output-artifact-directory: signed-installer
          parameters: |
            version: "${{ needs.build.outputs.version }}"
      - name: Verify installer and package signed release
        shell: pwsh
        env:
          APP_VERSION: ${{ needs.build.outputs.version }}
        run: |
          $setup = "MediaDownloader-v$env:APP_VERSION-Setup.exe"
          ./scripts/verify_signature.ps1 -Path "signed-installer/$setup"
          Copy-Item "signed-installer/$setup" "Release/v$env:APP_VERSION/$setup" -Force
          python scripts/package_release.py
          if ($LASTEXITCODE -ne 0) { throw 'Release packaging failed' }
      - name: Upload signed release (publication remains manual)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signed-release
          path: Release/v${{ needs.build.outputs.version }}/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
